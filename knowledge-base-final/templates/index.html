<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库</title>
<style>
  :root {
    --bg:            #faf8f5;
    --sidebar-bg:    #fffaf5;
    --card:          #ffffff;
    --card-hover:    #fef9f3;
    --border:        #e8e0d5;
    --border-light:  #f0ebe2;
    --text:          #4a3728;
    --text-secondary:#8b7355;
    --text-muted:    #b8a48e;
    --primary:       #d4956b;
    --primary-hover: #c17f55;
    --primary-light: #fdf0e8;
    --accent:        #b8956a;
    --success:       #7eb896;
    --success-light: #e8f5ee;
    --danger:        #d4786e;
    --danger-light:  #fef0ee;
    --warning:       #d4a96e;
    --warning-light: #fef8f0;
    --info:          #8bafce;
    --info-light:    #eef5fb;
    --shadow-sm:     0 1px 3px rgba(74,55,40,.06);
    --shadow-md:     0 4px 16px rgba(74,55,40,.08);
    --radius:        10px;
    --radius-sm:     6px;
    --transition:    .2s ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    user-select: none;
  }

  /* ============ Sidebar ============ */
  .sidebar {
    width: 300px;
    min-width: 240px;
    max-width: 500px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
  }
  .sidebar-header {
    padding: 18px 20px 14px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-header .dot {
    width: 8px; height: 8px;
    background: var(--primary);
    border-radius: 50%;
    display: inline-block;
  }
  .library-bar {
    display: flex;
    gap: 6px;
    padding: 0 16px 14px;
    border-bottom: 1px solid var(--border-light);
    align-items: center;
  }
  .library-bar select {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .library-bar select:focus { border-color: var(--primary); }
  .library-bar .btn-icon {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }
  .library-bar .btn-icon:hover { background: var(--primary-light); border-color: var(--primary); }
  .library-bar .btn-icon.danger:hover { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }
  .sidebar-content::-webkit-scrollbar { width: 4px; }
  .sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sidebar-section { margin-bottom: 18px; }
  .sidebar-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .dir-input { display: flex; gap: 6px; }
  .dir-input input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }
  .dir-input input::placeholder { color: var(--text-muted); }
  .dir-input input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: var(--transition);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 4px; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #c06a60; }
  .btn-outline {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { background: var(--bg); border-color: var(--text-muted); }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-warning:hover { opacity: .9; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { opacity: .9; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-card .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .file-list { max-height: 200px; overflow-y: auto; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    transition: var(--transition);
  }
  .file-item:hover { background: var(--primary-light); }
  .file-item .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
  .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item .size { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
  .file-item .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .file-item .status-dot.ok { background: var(--success); }
  .file-item .status-dot.err { background: var(--danger); }
  .file-item .status-dot.wait { background: var(--warning); }

  .sidebar-actions { display: flex; flex-direction: column; gap: 6px; }
  .sidebar-actions .btn { width: 100%; justify-content: center; }

  .progress-bar {
    height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--primary);
    transition: width .3s ease;
    border-radius: 2px;
    width: 0%;
  }
  #indexStatus {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* ============ Splitter ============ */
  .splitter {
    width: 6px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    transition: background .15s;
  }
  .splitter:hover, .splitter.active { background: var(--primary); opacity: .4; }
  .splitter-h {
    height: 6px;
    cursor: row-resize;
    width: 100%;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    transition: background .15s;
  }
  .splitter-h:hover, .splitter-h.active { background: var(--primary); opacity: .4; }

  /* ============ Main ============ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .main-header {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .tabs { display: flex; gap: 2px; }
  .tab {
    padding: 9px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    transition: var(--transition);
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); background: var(--bg); }
  .tab.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
  .main-header .spacer { flex: 1; }
  .status-badge {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--bg);
    color: var(--text-secondary);
    font-weight: 500;
  }
  .status-badge.ok { background: var(--success-light); color: #3d7a5c; }
  .status-badge.err { background: var(--danger-light); color: #a84e44; }

  /* ============ Tab Content ============ */
  .tab-content { display: none; flex: 1; overflow: hidden; }
  .tab-content.active { display: flex; flex-direction: column; flex: 1; }

  /* -- Chat -- */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.65;
    font-size: 14px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    background: var(--primary);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    background: var(--card);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .msg .time { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .msg.user .time { color: rgba(255,255,255,.6); text-align: right; }

  .chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 8px;
  }
  .chat-empty .icon { font-size: 48px; opacity: .25; }
  .chat-empty p { font-size: 15px; }

  .chat-input-bar {
    padding: 12px 24px 16px;
    border-top: 1px solid var(--border);
    background: var(--card);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .chat-input-bar textarea {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    resize: none;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    min-height: 42px;
    transition: var(--transition);
  }
  .chat-input-bar textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .chat-input-bar .btn { height: 42px; padding: 0 20px; border-radius: var(--radius); font-size: 14px; }

  /* -- Material Gen -- */
  .mat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 14px;
    overflow: hidden;
  }
  .mat-container > .row { display: flex; gap: 14px; flex: 1; min-height: 0; }
  .mat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .mat-panel .panel-header {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .mat-panel textarea {
    flex: 1;
    border: none;
    padding: 12px 14px;
    font-size: 13px;
    font-family: 'Consolas', 'Courier New', monospace;
    resize: none;
    outline: none;
    line-height: 1.6;
    background: var(--card);
  }
  .mat-output {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .mat-output h1, .mat-output h2, .mat-output h3 { margin-top: 16px; margin-bottom: 8px; color: var(--text); }
  .mat-output h1 { font-size: 18px; }
  .mat-output h2 { font-size: 16px; }
  .mat-output h3 { font-size: 14px; }
  .mat-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* -- File Search -- */
  .search-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 14px;
    overflow: hidden;
  }
  .search-bar {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    outline: none;
    transition: var(--transition);
  }
  .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .search-bar .btn { height: 44px; padding: 0 20px; border-radius: var(--radius); font-size: 14px; }
  .search-options { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--text-secondary); flex-shrink: 0; }
  .search-options label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .search-results {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .search-result-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
  .search-result-card .sr-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .search-result-card .sr-file {
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }
  .search-result-card .sr-file:hover { color: var(--primary); text-decoration: underline; }
  .search-result-card .sr-meta { color: var(--text-muted); font-size: 12px; }
  .search-result-card .sr-content {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .search-result-card .sr-content mark {
    background: #fff3cd;
    color: var(--text);
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: 600;
  }
  .search-empty { text-align: center; padding: 40px; color: var(--text-muted); }
  .search-stats { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }

  /* ============ Bottom Panel (Errors / Index Results) ============ */
  .bottom-panel {
    height: 200px;
    min-height: 100px;
    max-height: 50%;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .bottom-panel-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .bottom-panel-header .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .bottom-panel-header .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .badge-dup { background: var(--warning-light); color: #8b6d30; }
  .badge-parse { background: var(--danger-light); color: #9b4a42; }
  .badge-embed { background: var(--info-light); color: #4a6d8b; }
  .badge-ok { background: var(--success-light); color: #3d7a5c; }

  .error-tabs { display: flex; gap: 2px; margin-left: 12px; }
  .error-tab {
    padding: 4px 12px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-muted);
    transition: var(--transition);
    border: 1px solid transparent;
  }
  .error-tab:hover { color: var(--text); }
  .error-tab.active { background: var(--card); border-color: var(--border); color: var(--text); font-weight: 600; }

  .error-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .error-list::-webkit-scrollbar { width: 4px; }
  .error-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .error-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid transparent;
    transition: var(--transition);
  }
  .error-item:hover { border-color: var(--border); }
  .error-item .err-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .error-item .err-info { flex: 1; min-width: 0; }
  .error-item .err-file {
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .error-item .err-file:hover { color: var(--primary); text-decoration: underline; }
  .error-item .err-msg { color: var(--text-secondary); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .error-item .err-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .error-item.dup .err-icon { color: var(--warning); }
  .error-item.parse .err-icon { color: var(--danger); }
  .error-item.embed .err-icon { color: var(--info); }

  .empty-panel { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }

  /* ============ Citation ============ */
  .citation {
    font-size: 11px; font-weight: 600; color: var(--primary);
    vertical-align: super; line-height: 1; cursor: default;
  }
  .citation a { color: var(--primary); text-decoration: none; cursor: pointer; }
  .citation a:hover { text-decoration: underline; }
  .ref-list { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border-light); }
  .ref-list h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .ref-item { font-size: 12px; color: var(--text-secondary); line-height: 1.8; }
  .ref-item .num { color: var(--primary); font-weight: 600; margin-right: 4px; }
  .ref-item .num-link { cursor: pointer; }
  .ref-item .num-link:hover { text-decoration: underline; }
  .mat-templates { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ============ Loading ============ */
  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(74,55,40,.15);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .loading-overlay.show { display: flex; }
  .loading-box {
    background: var(--card);
    border-radius: 14px;
    padding: 32px 44px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text-secondary); }

  /* ============ Modal ============ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(74,55,40,.3);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 14px;
    padding: 28px 32px;
    min-width: 440px;
    max-width: 540px;
    box-shadow: 0 20px 60px rgba(74,55,40,.15);
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; color: var(--text); }
  .modal label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text-secondary); }
  .modal input, .modal select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
    transition: var(--transition);
  }
  .modal input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  /* ============ Toast ============ */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    padding: 12px 28px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: transform .35s ease, opacity .35s ease;
    pointer-events: none;
    z-index: 300;
    background: var(--text);
    color: #fff;
    box-shadow: 0 8px 24px rgba(74,55,40,.2);
    font-weight: 500;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .msg { max-width: 95%; }
    .modal { min-width: auto; width: 90vw; }
    .mat-container > .row { flex-direction: column; }
    .bottom-panel { height: 150px; }
  }
</style>
</head>
<body>

<!-- ==================== SIDEBAR ==================== -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="dot"></span> 知识库
  </div>
  <div class="library-bar">

<script>
// ==================== STATE ====================
let state = {
  scannedFiles: [],
  indexing: false,
  indexingPoll: null,
  currentKb: '默认库',
  libraries: [],
  indexErrors: { dup: [], parse: [], embed: [] },
  settings: {
    api_key: '',
    embedding_api_key: '',
    chunk_size: 512,
    top_k: 5,
  },
};

// ==================== DRAGGABLE PANELS ====================
function initSplitters() {
  const sidebar = document.getElementById('sidebar');
  const sidebarSplitter = document.getElementById('sidebarSplitter');
  const bottomPanel = document.getElementById('bottomPanel');
  const bottomSplitter = document.getElementById('bottomSplitter');
  const mainArea = document.getElementById('mainArea');

  // Sidebar width drag
  let sideDragging = false;
  sidebarSplitter.addEventListener('mousedown', (e) => {
    sideDragging = true;
    sidebarSplitter.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!sideDragging) return;
    const w = Math.max(240, Math.min(500, e.clientX));
    sidebar.style.width = w + 'px';
    sidebar.style.minWidth = w + 'px';
    sidebar.style.maxWidth = w + 'px';
    localStorage.setItem('sidebar_width', w);
  });
  document.addEventListener('mouseup', () => {
    if (sideDragging) {
      sideDragging = false;
      sidebarSplitter.classList.remove('active');
      document.body.style.cursor = '';
    }
  });

  // Bottom panel height drag
  let bottomDragging = false;
  let bottomStartY = 0, bottomStartH = 0;
  bottomSplitter.addEventListener('mousedown', (e) => {
    bottomDragging = true;
    bottomStartY = e.clientY;
    bottomStartH = bottomPanel.offsetHeight;
    bottomSplitter.classList.add('active');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!bottomDragging) return;
    const mainRect = mainArea.getBoundingClientRect();
    const maxH = mainRect.height * 0.5;
    const newH = Math.max(100, Math.min(maxH, bottomStartH + (bottomStartY - e.clientY)));
    bottomPanel.style.height = newH + 'px';
    bottomPanel.style.minHeight = newH + 'px';
    localStorage.setItem('bottom_panel_h', Math.round(newH));
  });
  document.addEventListener('mouseup', () => {
    if (bottomDragging) {
      bottomDragging = false;
      bottomSplitter.classList.remove('active');
      document.body.style.cursor = '';
    }
  });

  // Restore sizes
  const savedSidebar = localStorage.getItem('sidebar_width');
  if (savedSidebar) {
    const w = parseInt(savedSidebar);
    if (w >= 240 && w <= 500) {
      sidebar.style.width = w + 'px';
      sidebar.style.minWidth = w + 'px';
      sidebar.style.maxWidth = w + 'px';
    }
  }
  const savedBottom = localStorage.getItem('bottom_panel_h');
  if (savedBottom) {
    const h = parseInt(savedBottom);
    if (h >= 100) {
      bottomPanel.style.height = h + 'px';
      bottomPanel.style.minHeight = h + 'px';
    }
  }
}

// ==================== ERROR PANEL ====================
function renderErrors() {
  const all = [
    ...state.indexErrors.dup.map(e => ({ ...e, cat: 'dup' })),
    ...state.indexErrors.parse.map(e => ({ ...e, cat: 'parse' })),
    ...state.indexErrors.embed.map(e => ({ ...e, cat: 'embed' })),
  ];

  document.getElementById('badgeDup').textContent = state.indexErrors.dup.length;
  document.getElementById('badgeParse').textContent = state.indexErrors.parse.length;
  document.getElementById('badgeEmbed').textContent = state.indexErrors.embed.length;

  const okCount = document.getElementById('badgeOk');
  okCount.style.display = all.length === 0 ? 'none' : 'inline';
  // Count completed ok files from the file list
  const okFiles = document.querySelectorAll('#fileList .status-dot.ok').length;
  okCount.textContent = '完成 ' + okFiles;

  const activeCat = document.querySelector('.error-tab.active')?.dataset?.cat || 'all';
  const filtered = activeCat === 'all' ? all : all.filter(e => e.cat === activeCat);

  const el = document.getElementById('errorList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-panel">✅ 暂无此类错误</div>';
    return;
  }

  const catLabel = { dup: '重复', parse: '解析', embed: '嵌入' };
  const icons = { dup: '🔄', parse: '❌', embed: '⬆️' };

  el.innerHTML = filtered.map((e, i) => `
    <div class="error-item ${e.cat}">
      <span class="err-icon">${icons[e.cat]}</span>
      <div class="err-info">
        <span class="err-file" onclick="openFile('${escapeHtmlAttr(e.path || '')}')" title="${escapeHtmlAttr(e.path || '')}">${escapeHtml(e.file || '')}</span>
        <span style="font-size:11px;color:var(--text-muted);margin-left:8px;">[${catLabel[e.cat]}]</span>
        <div class="err-msg">${escapeHtml(e.message || '')}</div>
      </div>
      <div class="err-actions">
        ${e.cat !== 'dup' ? `<button class="btn btn-outline btn-xs" onclick="retryFile('${escapeHtmlAttr(e.path || '')}', '${escapeHtmlAttr(e.cat)}')" title="重新解析">🔄 重试</button>` : ''}
        <button class="btn btn-outline btn-xs" onclick="removeFileIndex('${escapeHtmlAttr(e.path || '')}')" title="删除该文件的索引记录" style="color:var(--danger);">🗑️ 删除索引</button>
      </div>
    </div>
  `).join('');
}

function filterErrors(cat) {
  document.querySelectorAll('.error-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  renderErrors();
}

function clearErrors() {
  if (!confirm('确定清除所有错误记录？')) return;
  state.indexErrors = { dup: [], parse: [], embed: [] };
  renderErrors();
}

function addErrors(errors) {
  if (!errors || !errors.length) return;
  // Dedup: build set of existing keys to avoid duplicates from repeated polling.
  // Use composite key: type|path|message — so errors without path still get deduped,
  // and different error types for the same file are kept separate.
  const seen = new Set();
  for (const cat of ['dup', 'parse', 'embed']) {
    for (const e of state.indexErrors[cat]) {
      const t = e.type || '';
      const key = t + '|' + (e.path || '') + '|' + (e.message || e.file || '');
      seen.add(key);
    }
  }
  errors.forEach(e => {
    const type = e.type || '';
    const key = type + '|' + (e.path || '') + '|' + (e.message || e.file || '');
    if (seen.has(key)) return;
    seen.add(key);

    if (type === 'parse_error' || type === 'parse') {
      state.indexErrors.parse.push(e);
    } else if (type === 'embed_error' || type === 'embed') {
      state.indexErrors.embed.push(e);
    } else if (type === 'duplicate' || type === 'dup') {
      state.indexErrors.dup.push(e);
    } else {
      state.indexErrors.parse.push({ ...e, type: 'parse_error' });
    }
  });
  renderErrors();
}

async function retryFile(filePath, cat) {
  if (!filePath) return;
  if (!state.settings.api_key) {
    showToast('请先配置 API 密钥', 'error');
    openSettings();
    return;
  }
  showLoading('重新解析中...');
  try {
    const res = await fetch('/api/kb/retry-file', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        file_path: filePath,
        api_key: state.settings.api_key,
        embedding_api_key: state.settings.embedding_api_key,
        kb_name: state.currentKb,
      }),
    });
    const data = await res.json();
    hideLoading();
    if (data.success) {
      showToast('文件重新解析成功！', 'success');
      // 移除对应错误
      if (cat === 'parse') state.indexErrors.parse = state.indexErrors.parse.filter(e => e.path !== filePath);
      else if (cat === 'embed') state.indexErrors.embed = state.indexErrors.embed.filter(e => e.path !== filePath);
      else state.indexErrors.dup = state.indexErrors.dup.filter(e => e.path !== filePath);
      renderErrors();
      refreshStatus();
    } else {
      showToast(data.error || '重新解析失败', 'error');
    }
  } catch(e) {
    hideLoading();
    showToast('重新解析失败: ' + e.message, 'error');
  }
}

async function removeFileIndex(filePath) {
  if (!filePath) return;
  if (!confirm(`确定删除该文件的索引记录？\n\n文件: ${filePath}\n\n这将从索引数据库中移除该文件的所有文本块，但不删除原始文件。删除后可重新扫描并索引。`)) return;
  showLoading('删除索引记录...');
  try {
    const res = await fetch('/api/kb/remove-file', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        file_path: filePath,
        kb_name: state.currentKb,
      }),
    });
    const data = await res.json();
    hideLoading();
    if (data.success) {
      showToast('索引记录已删除，可重新扫描索引', 'success');
      // 清除该文件相关的所有错误
      state.indexErrors.dup = state.indexErrors.dup.filter(e => e.path !== filePath);
      state.indexErrors.parse = state.indexErrors.parse.filter(e => e.path !== filePath);
      state.indexErrors.embed = state.indexErrors.embed.filter(e => e.path !== filePath);
      renderErrors();
      refreshStatus();
    } else {
      showToast(data.error || '删除失败', 'error');
    }
  } catch(e) {
    hideLoading();
    showToast('删除失败: ' + e.message, 'error');
  }
}

// ==================== FILE SEARCH ====================
async function doFileSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { showToast('请输入搜索关键字', 'error'); return; }
  if (!state.settings.api_key) {
    showToast('请先配置 API 密钥', 'error');
    openSettings();
    return;
  }

  const mode = document.querySelector('input[name="searchMode"]:checked')?.value || 'keyword';
  const resultsEl = document.getElementById('searchResults');
  const statsEl = document.getElementById('searchStats');

  resultsEl.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;color:var(--text-muted);">搜索中...</p></div>';

  try {
    const res = await fetch('/api/kb/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        query: query,
        mode: mode === 'fuzzy' ? 'hybrid' : 'keyword',
        top_k: 50,
        kb_name: state.currentKb,
        api_key: state.settings.api_key,
        embedding_api_key: state.settings.embedding_api_key,
      }),
    });
    const data = await res.json();
    if (data.success && data.data) {
      const results = data.data.results || [];
      statsEl.textContent = `找到 ${results.length} 条结果 (${data.data.mode || mode})`;

      // 按文件分组
      const byFile = {};
      results.forEach(r => {
        const f = r.source_file || '未知文件';
        if (!byFile[f]) byFile[f] = [];
        byFile[f].push(r);
      });

      if (Object.keys(byFile).length === 0) {
        resultsEl.innerHTML = '<div class="search-empty"><div style="font-size:40px;opacity:.2;margin-bottom:8px;">📭</div><p>未找到匹配的内容</p></div>';
        return;
      }

      // 高亮关键字
      const kw = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(${kw})`, 'gi');

      resultsEl.innerHTML = Object.entries(byFile).map(([file, chunks]) => {
        const icon = getFileIcon(file);
        const firstChunk = chunks[0] || {};
        const filePath = firstChunk.source_file || file;
        return `
          <div class="search-result-card">
            <div class="sr-header">
              <span>${icon}</span>
              <span class="sr-file" onclick="openFile('${escapeHtmlAttr(filePath)}')" title="${escapeHtmlAttr(filePath)}">${escapeHtml(file)}</span>
              <span class="sr-meta">${chunks.length} 处匹配</span>
            </div>
            ${chunks.slice(0, 3).map((c, i) => `
              <div class="sr-content" style="margin-bottom:${i < chunks.slice(0, 3).length - 1 ? '8' : '0'}px;">
                <span style="font-size:11px;color:var(--text-muted);">片段 ${c.chunk_index || i + 1}:</span>
                ${highlightText(c.text || '', re)}
              </div>
            `).join('')}
            ${chunks.length > 3 ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">... 还有 ${chunks.length - 3} 处匹配</div>` : ''}
          </div>
        `;
      }).join('');
    } else {
      resultsEl.innerHTML = `<div class="search-empty">❌ ${data.error || '搜索失败'}</div>`;
      statsEl.textContent = '';
    }
  } catch(e) {
    resultsEl.innerHTML = `<div class="search-empty">❌ 搜索出错: ${e.message}</div>`;
    statsEl.textContent = '';
  }
}

function getFileIcon(file) {
  const ext = (file || '').split('.').pop().toLowerCase();
  const map = { pdf: '📄', docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', vsdx: '📐', pptx: '📽️', ppt: '📽️', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', bmp: '🖼️', tiff: '🖼️', tif: '🖼️', zip: '📦', rar: '🗜️', dxf: '📐', txt: '📃', csv: '📊', md: '📝' };
  return map[ext] || '📄';
}

function highlightText(text, regex) {
  return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(regex, '<mark>$1</mark>');
}

// ==================== LIBRARY MANAGEMENT ====================
async function loadLibraries() {
  try {
    const res = await fetch('/api/kb/libraries');
    const data = await res.json();
    if (data.success) {
      state.libraries = data.data.libraries;
      const saved = localStorage.getItem('kb_current');
      if (saved && state.libraries.includes(saved)) {
        state.currentKb = saved;
      } else {
        state.currentKb = data.data.current;
      }
      if (state.currentKb !== data.data.current) {
        await fetch('/api/kb/libraries/switch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: state.currentKb}),
        });
      }
      renderLibrarySelect();
    }
  } catch(e) {}
}

function renderLibrarySelect() {
  const sel = document.getElementById('librarySelect');
  sel.innerHTML = state.libraries.map(name =>
    `<option value="${name}" ${name === state.currentKb ? 'selected' : ''}>${name}</option>`
  ).join('');
}

async function switchLibrary(name) {
  if (name === state.currentKb) return;
  try {
    const res = await fetch('/api/kb/libraries/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name}),
    });
    const data = await res.json();
    if (data.success) {
      state.currentKb = name;
      localStorage.setItem('kb_current', name);
      renderLibrarySelect();
      showToast(`已切换到「${name}」`, 'success');
      refreshStatus();
    } else {
      showToast(data.error, 'error');
    }
  } catch(e) {
    showToast('切换失败: ' + e.message, 'error');
  }
}

async function promptCreateLibrary() {
  const name = prompt('请输入新知识库名称：');
  if (!name || !name.trim()) return;
  try {
    const res = await fetch('/api/kb/libraries/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name.trim()}),
    });
    const data = await res.json();
    if (data.success) {
      state.libraries = data.data.libraries;
      state.currentKb = name.trim();
      localStorage.setItem('kb_current', state.currentKb);
      renderLibrarySelect();
      showToast(`知识库「${name}」已创建`, 'success');
      refreshStatus();
    } else {
      showToast(data.error, 'error');
    }
  } catch(e) {
    showToast('创建失败: ' + e.message, 'error');
  }
}

async function promptDeleteLibrary() {
  if (state.libraries.length <= 1) {
    showToast('至少保留一个知识库', 'error');
    return;
  }
  if (!confirm(`确定删除知识库「${state.currentKb}」？所有索引数据将被永久删除。`)) return;
  try {
    const res = await fetch('/api/kb/libraries/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: state.currentKb}),
    });
    const data = await res.json();
    if (data.success) {
      state.libraries = data.data.libraries;
      state.currentKb = data.data.current;
      localStorage.setItem('kb_current', state.currentKb);
      renderLibrarySelect();
      showToast('知识库已删除', 'success');
      refreshStatus();
    } else {
      showToast(data.error, 'error');
    }
  } catch(e) {
    showToast('删除失败: ' + e.message, 'error');

}

function kbQuery() {

}

// ==================== INDEX ====================
async function rebuildIndex() {
  if (state.scannedFiles.length === 0) { showToast('请先扫描目录', 'error'); return; }
  if (!confirm(`确定重新构建索引？将清除现有 ${state.scannedFiles.length} 个文件的索引后重建。`)) return;
  if (state.indexing) { showToast('正在索引中...', 'error'); return; }
  if (!state.settings.api_key) { showToast('请先配置 API 密钥', 'error'); openSettings(); return; }

  state.indexErrors = { dup: [], parse: [], embed: [] };
  renderErrors();

  state.indexing = true;
  showLoading('清除旧索引...');
  try {
    await fetch('/api/kb/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({kb_name: state.currentKb}),
    });
  } catch(e) {}

  const pb = document.getElementById('progressBar');
  pb.style.display = 'block';
  document.getElementById('indexStatus').textContent = '开始重建...';

  hideLoading();
  showLoading(`正在重建 ${state.scannedFiles.length} 个文件...`);
  try {
    const res = await fetch('/api/kb/index', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        files: state.scannedFiles.map(f => f.path),
        api_key: state.settings.api_key,
        embedding_api_key: state.settings.embedding_api_key,
        kb_name: state.currentKb,
      }),
    });
    const data = await res.json();
    hideLoading();
    if (data.success) {
      showToast(`正在重建 ${state.scannedFiles.length} 个文件`, 'success');
      state.indexingPoll = setInterval(pollIndexStatus, 1000);
    } else {
      showToast(data.error, 'error');
      state.indexing = false;
      pb.style.display = 'none';
    }
  } catch(e) {
    hideLoading();
    showToast('重建失败: ' + e.message, 'error');
    state.indexing = false;
    pb.style.display = 'none';
  }
}

async function startIndex() {
  if (state.scannedFiles.length === 0) { showToast('请先扫描目录', 'error'); return; }
  if (state.indexing) { showToast('正在索引中...', 'error'); return; }
  if (!state.settings.api_key) { showToast('请先配置 API 密钥', 'error'); openSettings(); return; }

  state.indexErrors = { dup: [], parse: [], embed: [] };
  renderErrors();

  state.indexing = true;
  const pb = document.getElementById('progressBar');
  pb.style.display = 'block';
  document.getElementById('indexStatus').textContent = '检查已索引文件...';

  let newFiles;
  try {
    const statusRes = await fetch('/api/kb/files?' + kbQuery());
    const statusData = await statusRes.json();
    if (statusData.success && statusData.data.files.length > 0) {
      const indexedPaths = new Set(statusData.data.files.map(f => f.path));
      newFiles = state.scannedFiles.filter(f => !indexedPaths.has(f.path));
    } else {
      newFiles = [...state.scannedFiles];
    }
  } catch(e) {
    newFiles = [...state.scannedFiles];
  }

  if (newFiles.length === 0) {
    showToast('所有文件均已索引', 'success');
    state.indexing = false;
    pb.style.display = 'none';
    return;
  }

  showLoading(`发现 ${newFiles.length} 个新文件，开始构建...`);
  try {
    const res = await fetch('/api/kb/index', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        files: newFiles.map(f => f.path),
        api_key: state.settings.api_key,
        embedding_api_key: state.settings.embedding_api_key,
        kb_name: state.currentKb,
      }),
    });
    const data = await res.json();
    hideLoading();
    if (data.success) {
      showToast(`正在索引 ${newFiles.length} 个新文件`, 'success');
      state.indexingPoll = setInterval(pollIndexStatus, 1000);
    } else {
      showToast(data.error, 'error');
      state.indexing = false;
      pb.style.display = 'none';
    }
  } catch(e) {
    hideLoading();
    showToast('启动索引失败: ' + e.message, 'error');
    state.indexing = false;
    pb.style.display = 'none';
  }
}

async function stopIndexing() {
  if (!confirm('确定停止正在进行的索引任务？已处理的部分不会丢失。')) return;
  try {
    const res = await fetch('/api/kb/stop-indexing', { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      showToast('已发送停止信号，当前批次完成后将停止', 'success');
      document.getElementById('stopBtn').style.display = 'none';
    } else {
      showToast(data.error || '停止失败', 'error');
    }
  } catch(e) {
    showToast('停止失败: ' + e.message, 'error');
  }
}

async function pollIndexStatus() {
  try {
    const res = await fetch('/api/kb/indexing-status');
    const data = await res.json();
    if (!data.success) return;

    const st = data.data;
    const pf = document.getElementById('progressFill');
    const stEl = document.getElementById('indexStatus');

    if (st.total > 0) pf.style.width = (st.current / st.total * 100) + '%';
    stEl.textContent = st.progress || '';

    // 显示/隐藏停止按钮
    document.getElementById('stopBtn').style.display = st.running ? '' : 'none';

    // 更新错误分类
    if (st.errors && st.errors.length > 0) {
      addErrors(st.errors);
    }

    if (!st.running) {
      clearInterval(state.indexingPoll);
      state.indexingPoll = null;
      state.indexing = false;
      document.getElementById('progressBar').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'none';

      const totalErrors = state.indexErrors.dup.length + state.indexErrors.parse.length + state.indexErrors.embed.length;
      if (totalErrors > 0) {
        stEl.textContent = `完成，${totalErrors} 个错误 (详见下方面板)`;
        showToast(`索引完成，有 ${totalErrors} 个错误`, 'error');
      } else {
        stEl.textContent = '索引构建完成！';
        showToast('索引构建完成！', 'success');
      }
      refreshStatus();
    }
  } catch(e) {}
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/kb/status?' + kbQuery());
    const data = await res.json();
    if (data.success) {
      document.getElementById('statFiles').textContent = data.data.file_count || 0;
      document.getElementById('statChunks').textContent = data.data.chunks || 0;
      renderFileList();

      // Show/hide resume button based on checkpoint
      const resumeBtn = document.getElementById('resumeBtn');
      const cp = data.data.checkpoint;
      if (cp && cp.file_list && cp.file_list.length > 0 && cp.status && !state.indexing) {
        resumeBtn.style.display = '';
        const pct = cp.total > 0 ? Math.round(cp.completed / cp.total * 100) : 0;
        resumeBtn.textContent = `📌 恢复中断索引 (${pct}%)`;
      } else {
        resumeBtn.style.display = 'none';
      }
    }
  } catch(e) {}
}

async function renderFileList() {
  try {
    const res = await fetch('/api/kb/files?' + kbQuery());
    const data = await res.json();
    if (!data.success || !data.data.files) return;
    const el = document.getElementById('fileList');
    if (data.data.files.length === 0) {
      el.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px;">暂无文件</div>';

    const extMap = { word:'📝', excel:'📊', pdf:'📄', visio:'📐', archive:'📦', image:'🖼️', cad:'📐', ppt:'📽️' };

      `<div class="file-item" data-file-path="${escapeHtmlAttr(f.path)}" style="cursor:pointer;">
        <span class="icon">${extMap[f.type] || '📄'}</span>

        <span class="size">${f.chunks || 0} 块</span>

function filterFileList() {
  const query = (document.getElementById('fileSearch').value || '').toLowerCase();
  const items = document.querySelectorAll('#fileList .file-item');
  items.forEach(item => {
    const name = (item.querySelector('.name')?.textContent || '').toLowerCase();
    const path = (item.dataset.filePath || '').toLowerCase();
    item.style.display = (!query || name.includes(query) || path.includes(query)) ? '' : 'none';
  });
}

async function summarizeAll() {
  const statusRes = await fetch('/api/kb/status?' + kbQuery());
  const statusData = await statusRes.json();
  if (!statusData.success || statusData.data.file_count === 0) {
    showToast('没有已索引的文件', 'error');
    return;
  }
  if (!state.settings.api_key) { showToast('请先配置 API 密钥', 'error'); openSettings(); return; }
  const files = statusData.data.files;
  if (!files || files.length === 0) { showToast('没有已索引的文件', 'error'); return; }
  if (!confirm(`确定对 ${files.length} 个文件进行全文总结？这可能需要一些时间。`)) return;

  showLoading('正在生成全文总结...');
  try {
    const res = await fetch('/api/kb/summarize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({files, api_key: state.settings.api_key, kb_name: state.currentKb}),
    });
    const data = await res.json();
    hideLoading();
    if (data.success && data.data) {
      const container = document.getElementById('chatMessages');
      const empty = container.querySelector('.chat-empty');
      if (empty) empty.remove();
      if (data.data.overall) {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.innerHTML = '<b style="font-size:16px;">📊 全文总结报告</b><br><br>' + data.data.overall.replace(/\n/g, '<br>');
        container.appendChild(div);
      }
      (data.data.documents || []).forEach(doc => {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.innerHTML = '<b>📄 ' + doc.file_name + '</b> (' + doc.chunks + ' 块)<br><br>' + doc.summary.replace(/\n/g, '<br>');
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
      showToast('全文总结完成！', 'success');
    } else {
      showToast(data.error || '总结失败', 'error');
    }
  } catch(e) {
    hideLoading();
    showToast('总结失败: ' + e.message, 'error');
  }
}

async function resumeIndex() {
  try {
    const res = await fetch('/api/kb/status?' + kbQuery());
    const data = await res.json();
    if (!data.success || !data.data.checkpoint) {
      showToast('没有可恢复的索引任务', 'error');
      return;
    }
    const cp = data.data.checkpoint;
    if (!cp.file_list || cp.file_list.length === 0) {
      showToast('断点文件列表为空', 'error');
      return;
    }
    if (!confirm(`发现中断的索引任务（已完成 ${cp.completed}/${cp.total} 个文件），是否从中断处继续？`)) return;
    if (!state.settings.api_key) { showToast('请先配置 API 密钥', 'error'); openSettings(); return; }

    state.indexing = true;
    const pb = document.getElementById('progressBar');
    pb.style.display = 'block';
    document.getElementById('indexStatus').textContent = '恢复索引任务...';

    showLoading(`正在恢复索引 ${cp.file_list.length} 个文件...`);
    try {
      const idxRes = await fetch('/api/kb/index', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          files: cp.file_list,
          api_key: state.settings.api_key,
          embedding_api_key: state.settings.embedding_api_key,
          kb_name: state.currentKb,
        }),
      });
      const idxData = await idxRes.json();
      hideLoading();
      if (idxData.success) {
        showToast('索引已恢复，继续处理...', 'success');
        state.indexingPoll = setInterval(pollIndexStatus, 1000);
      } else {
        showToast(idxData.error, 'error');
        state.indexing = false;
        pb.style.display = 'none';
      }
    } catch(e) {
      hideLoading();
      showToast('恢复失败: ' + e.message, 'error');
      state.indexing = false;
      pb.style.display = 'none';
    }
  } catch(e) {
    showToast('检查断点失败: ' + e.message, 'error');
  }
}

async function testEmbeddingKeys() {
  const rawKeys = document.getElementById('embeddingKeyInput').value.trim();
  if (!rawKeys) { showToast('请先输入 Embedding API 密钥', 'error'); return; }

  const statusEl = document.getElementById('embedTestStatus');
  const resultsEl = document.getElementById('embedTestResults');
  statusEl.textContent = '测试中...';
  statusEl.style.color = 'var(--text-secondary)';
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = '<div class="spinner" style="margin:8px auto;"></div>';

  try {
    const res = await fetch('/api/config/test-embedding', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ embedding_keys: rawKeys }),
    });
    const data = await res.json();
    if (data.success && data.data) {
      const r = data.data;
      statusEl.textContent = `${r.ok}/${r.total} 个通过，${r.fail} 个失败`;
      statusEl.style.color = r.fail === 0 ? 'var(--success)' : 'var(--danger)';

      resultsEl.innerHTML = r.results.map(item => {
        const icon = item.ok ? '✅' : '❌';
        const info = item.ok ? `维度: ${item.dim}` : item.error;
        const bg = item.ok ? 'var(--success-light)' : 'var(--danger-light)';
        return `<div style="padding:6px 10px;margin:3px 0;border-radius:4px;background:${bg};font-family:monospace;font-size:11px;">${icon} <b>${escapeHtml(item.key)}</b> &nbsp;${escapeHtml(info)}</div>`;
      }).join('');
    } else {
      statusEl.textContent = '测试失败';
      statusEl.style.color = 'var(--danger)';
      resultsEl.innerHTML = `<div style="color:var(--danger);">${escapeHtml(data.error || '未知错误')}</div>`;
    }
  } catch(e) {
    statusEl.textContent = '请求失败';
    statusEl.style.color = 'var(--danger)';
    resultsEl.innerHTML = `<div style="color:var(--danger);">${escapeHtml(e.message)}</div>`;
  }
}

// ==================== OPEN FILE ====================
function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeHtmlAttr(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function openFile(filePath) {
  if (!filePath) return;
  try {
    const res = await fetch('/api/kb/open-file', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: filePath, kb_name: state.currentKb}),
    });
    const data = await res.json();
    if (!data.success) showToast(data.error || '打开文件失败', 'error');
  } catch(e) {
    showToast('打开文件失败: ' + e.message, 'error');
  }
}

document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-file-path]');
  if (link) { e.preventDefault(); openFile(link.dataset.filePath); }
});

// ==================== CHAT ====================
function setupChatInput() {
  const ta = document.getElementById('chatInput');
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
}

async function clearChat() {
  if (!confirm('确定清除所有对话记录？')) return;
  try {
    await fetch('/api/chat/clear', {method: 'POST'});
    document.getElementById('chatMessages').innerHTML =
      '<div class="chat-empty"><div class="icon">💬</div><p>向知识库提问，获取基于文档的答案</p><p style="font-size:13px;color:var(--text-muted);">先在左侧输入文档目录并构建索引</p></div>';
    showToast('对话已清除', 'success');
  } catch(e) {
    showToast('清除失败: ' + e.message, 'error');
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const query = input.value.trim();
  if (!query) return;
  if (!state.settings.api_key) { showToast('请先配置 API 密钥', 'error'); openSettings(); return; }

  input.value = '';
  input.style.height = '42px';
  addMessage('user', query);

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = '思考中...';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, api_key: state.settings.api_key, kb_name: state.currentKb}),
    });
    const data = await res.json();
    if (data.success) {
      addAssistantMessage(data.data.answer, data.data.sources);
    } else {
      addMessage('assistant', '❌ ' + (data.error || '请求失败'));
    }
  } catch(e) {
    addMessage('assistant', '❌ 网络错误: ' + e.message);
  }
  sendBtn.disabled = false;
  sendBtn.textContent = '发送';
}

function addMessage(role, content) {
  const container = document.getElementById('chatMessages');
  const empty = container.querySelector('.chat-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString();
  div.appendChild(time);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addAssistantMessage(answer, sources) {
  const container = document.getElementById('chatMessages');
  const sourceMap = new Map();
  let num = 1;
  const srcRegex = /\[Source:\s*([^,\]]+?)(?:,\s*([^\]]+?))?\s*\]/gi;

  if (sources) {
    sources.forEach(s => {
      const key = s.file.toLowerCase().trim();
      if (!sourceMap.has(key)) sourceMap.set(key, { num: num++, display: s.file, filePath: s.file_path || '', positions: [] });
    });
  }
  let m;
  while ((m = srcRegex.exec(answer)) !== null) {
    const fileName = (m[1] || '').trim();
    const position = (m[2] || '').trim();
    const key = fileName.toLowerCase();
    if (sourceMap.has(key)) {
      if (position && !sourceMap.get(key).positions.includes(position)) sourceMap.get(key).positions.push(position);
    } else {
      sourceMap.set(key, { num: num++, display: fileName, filePath: '', positions: position ? [position] : [] });
    }
  }

  srcRegex.lastIndex = 0;
  let processed = answer.replace(srcRegex, (match, fileName, position) => {
    const key = (fileName || '').toLowerCase().trim();
    const entry = sourceMap.get(key);
    if (!entry) return match;
    if (entry.filePath) return `<sup class="citation"><a href="#" data-file-path="${escapeHtmlAttr(entry.filePath)}">[${entry.num}]</a></sup>`;
    return `<sup class="citation">[${entry.num}]</sup>`;
  });

  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = processed.replace(/\n/g, '<br>');

  if (sourceMap.size > 0) {
    const sorted = [...sourceMap.values()].sort((a, b) => a.num - b.num);
    const refDiv = document.createElement('div');
    refDiv.className = 'ref-list';
    refDiv.innerHTML = sorted.map(e => {
      const numHtml = e.filePath
        ? `<span class="num num-link" data-file-path="${escapeHtmlAttr(e.filePath)}">[${e.num}]</span>`
        : `<span class="num">[${e.num}]</span>`;
      const posHtml = e.positions.length > 0 ? ` — ${e.positions.join(', ')}` : '';
      return `<p class="ref-item">${numHtml}${e.display}${posHtml}</p>`;
    }).join('');
    div.appendChild(refDiv);
  }

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date().toLocaleTimeString();
  div.appendChild(time);

  const empty = container.querySelector('.chat-empty');
  if (empty) empty.remove();
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ==================== MATERIAL GEN ====================
function renderTemplates() {
  const el = document.getElementById('templateList');
  el.innerHTML = '<button class="btn btn-outline btn-sm" onclick="loadTemplate(\'custom\')">📋 自定义</button>';
  fetch('/api/material/templates').then(r => r.json()).then(data => {
    if (data.success) {
      Object.keys(data.data).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline btn-sm';
        btn.textContent = name;
        btn.onclick = () => loadTemplate(name);
        el.appendChild(btn);
      });
    }
  }).catch(() => {});
}

async function loadTemplate(name) {
  if (name === 'custom') { document.getElementById('frameworkInput').value = ''; return; }
  try {
    const res = await fetch('/api/material/templates');
    const data = await res.json();
    if (data.success && data.data[name]) document.getElementById('frameworkInput').value = data.data[name];
  } catch(e) {}
}

async function generateMaterial() {
  const framework = document.getElementById('frameworkInput').value.trim();
  if (!framework) { showToast('请输入框架大纲', 'error'); return; }
  if (!state.settings.api_key) { showToast('请先配置 API 密钥', 'error'); openSettings(); return; }

  const output = document.getElementById('matOutput');
  output.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><p style="margin-top:12px;color:var(--text-muted);">正在生成材料，请耐心等待...</p></div>';

  try {
    const res = await fetch('/api/material/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({framework, api_key: state.settings.api_key, kb_name: state.currentKb}),
    });
    const data = await res.json();
    if (data.success && data.data) {
      output.innerHTML = '';
      const sections = data.data.sections || [];

      const sourceMap = new Map();
      let num = 1;
      const srcRegex = /\[Source:\s*([^,\]]+?)(?:,\s*([^\]]+?))?\s*\]/gi;

      sections.forEach(sec => {
        (sec.sources || []).forEach(s => {
          const key = s.file.toLowerCase().trim();
          if (!sourceMap.has(key)) sourceMap.set(key, { num: num++, display: s.file, filePath: s.file_path || '', positions: [] });
        });
        let m;
        while ((m = srcRegex.exec(sec.content)) !== null) {
          const fileName = (m[1] || '').trim(), position = (m[2] || '').trim(), key = fileName.toLowerCase();
          if (sourceMap.has(key)) {
            if (position && !sourceMap.get(key).positions.includes(position)) sourceMap.get(key).positions.push(position);
          } else {
            sourceMap.set(key, { num: num++, display: fileName, filePath: '', positions: position ? [position] : [] });
          }
        }
      });

      sections.forEach(sec => {
        const h = document.createElement('h' + Math.min(sec.depth + 1, 4));
        h.textContent = sec.number + ' ' + sec.title;
        output.appendChild(h);
        const p = document.createElement('div');
        srcRegex.lastIndex = 0;
        let content = sec.content.replace(srcRegex, (match, fileName, position) => {
          const key = (fileName || '').toLowerCase().trim();
          const entry = sourceMap.get(key);
          if (!entry) return match;
          if (entry.filePath) return `<sup class="citation"><a href="#" data-file-path="${escapeHtmlAttr(entry.filePath)}">[${entry.num}]</a></sup>`;
          return `<sup class="citation">[${entry.num}]</sup>`;
        });
        p.innerHTML = content.replace(/\n/g, '<br>');
        output.appendChild(p);
      });

      if (sourceMap.size > 0) {
        const sorted = [...sourceMap.values()].sort((a, b) => a.num - b.num);
        const refDiv = document.createElement('div');
        refDiv.className = 'ref-list';
        refDiv.innerHTML = '<hr><h4>📚 参考来源</h4>' +
          sorted.map(e => {
            const numHtml = e.filePath
              ? `<span class="num num-link" data-file-path="${escapeHtmlAttr(e.filePath)}">[${e.num}]</span>`
              : `<span class="num">[${e.num}]</span>`;
            const posHtml = e.positions.length > 0 ? ` — ${e.positions.join(', ')}` : '';
            return `<p class="ref-item">${numHtml}${e.display}${posHtml}</p>`;
          }).join('');
        output.appendChild(refDiv);
      }
      output.dataset.fullText = data.data.full_text || '';
      showToast('材料生成完成！', 'success');
    } else {
      output.innerHTML = '<div style="color:var(--danger);padding:20px;">生成失败: ' + (data.error || '未知错误') + '</div>';
    }
  } catch(e) {
    output.innerHTML = '<div style="color:var(--danger);padding:20px;">生成失败: ' + e.message + '</div>';
  }
}

function copyMaterial() {
  const output = document.getElementById('matOutput');
  const text = output.dataset.fullText || output.textContent;
  if (!text || text === '暂无数据') { showToast('没有可复制的内容', 'error'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success')).catch(() => showToast('复制失败', 'error'));
}

async function exportMaterial() {
  const output = document.getElementById('matOutput');
  const text = output.dataset.fullText || output.textContent;
  if (!text || text === '暂无数据') { showToast('没有可导出的内容', 'error'); return; }
  try {
    const res = await fetch('/api/material/export', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, format: 'md'}),
    });
    const data = await res.json();
    if (data.success) {
      const blob = new Blob([data.data.text], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '核实材料_' + new Date().toISOString().slice(0,10) + '.md';
      a.click();
      URL.revokeObjectURL(url);
      showToast('导出成功', 'success');
    }
  } catch(e) {
    showToast('导出失败: ' + e.message, 'error');
  }
}

// ==================== SETTINGS ====================
function openSettings() {
  document.getElementById('apiKeyInput').value = state.settings.api_key || '';
  document.getElementById('embeddingKeyInput').value = state.settings.embedding_api_key || '';
  document.getElementById('chunkSizeInput').value = state.settings.chunk_size || 512;
  document.getElementById('topKInput').value = state.settings.top_k || 5;
  document.getElementById('apiTestResult').textContent = '';
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

async function testApi() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { showToast('请输入 API 密钥', 'error'); return; }
  const el = document.getElementById('apiTestResult');
  el.textContent = '测试中...';
  el.style.color = 'var(--text-secondary)';
  try {
    const res = await fetch('/api/config/test', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_key: key}),
    });
    const data = await res.json();
    if (data.success) {
      el.textContent = '✅ 连接成功: ' + (data.data.model || '');
      el.style.color = 'var(--success)';
      showToast('API 连接成功！', 'success');
    } else {
      el.textContent = '❌ ' + (data.error || '连接失败');
      el.style.color = 'var(--danger)';
    }
  } catch(e) {
    el.textContent = '❌ ' + e.message;
    el.style.color = 'var(--danger)';
  }
}

async function saveSettings() {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const embeddingKey = document.getElementById('embeddingKeyInput').value.trim();
  const chunkSize = parseInt(document.getElementById('chunkSizeInput').value) || 512;
  const topK = parseInt(document.getElementById('topKInput').value) || 5;

  state.settings.api_key = apiKey;
  state.settings.embedding_api_key = embeddingKey;
  state.settings.chunk_size = chunkSize;
  state.settings.top_k = topK;
  saveSettingsToLocal();
  updateApiStatus();

  try {
    await fetch('/api/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({api_key: apiKey, embedding_api_key: embeddingKey, chunk_size: chunkSize, top_k: topK}),
    });
  } catch(e) {}
  closeSettings();
  showToast('设置已保存', 'success');
}

// ==================== LOADING ====================
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '处理中...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

// ==================== TOAST ====================
let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  requestAnimationFrame(() => {
    el.classList.add('show');
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  });
}

// ==================== INIT ====================
init();
