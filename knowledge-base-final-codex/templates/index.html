<script>
// Prevent FOUC — set theme attribute before CSS loads
(function(){
  var t='blue';
  try{var s=JSON.parse(localStorage.getItem('kb_settings'));if(s&&s.theme)t=s.theme;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
